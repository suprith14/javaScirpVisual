<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Engine Lab — Interface tests</title>
  <style>
    :root { --bg: #0b0e1f; --panel: #161b36; --line: #2b3264; --text: #e8ebff; --muted: #8e96c8; --ok: #3ee6a8; --bad: #ff5d73; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f6fc; --panel: #fff; --line: #d6dbec; --text: #1b1f36; --muted: #5d6488; --ok: #0a8a5b; --bad: #c8243d; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 12px; }
    .sum { font-size: 16px; font-weight: 700; margin: 10px 0; }
    .row { font-family: Consolas, monospace; font-size: 12.5px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { white-space: pre-wrap; margin: 2px 0 6px 18px; color: var(--muted); font-size: 12px; }
    iframe { width: 1280px; height: 900px; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; max-width: 100%; }
  </style>
</head>
<body>
  <h1>🧪 Interface tests</h1>
  <p>Opens the real app in the frame below and clicks through menus, practice modes and tools. Run it over a local web server (for example <code>npx serve</code>); browsers block access to a <code>file://</code> frame.</p>
  <div class="sum" id="sum">Running…</div>
  <div id="out"></div>
  <iframe id="app" title="App under test"></iframe>
  <script>
  (async function () {
    'use strict';
    const frame = document.getElementById('app'), out = document.getElementById('out');
    let pass = 0, fail = 0;
    const row = (ok, label, detail) => {
      ok ? pass++ : fail++;
      const d = document.createElement('div');
      d.className = 'row ' + (ok ? 'ok' : 'bad');
      d.textContent = (ok ? '✔ ' : '✘ ') + label;
      out.appendChild(d);
      if (!ok && detail) { const p = document.createElement('pre'); p.textContent = detail; out.appendChild(p); }
    };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const load = params => new Promise(resolve => { frame.onload = () => setTimeout(resolve, 900); frame.src = 'index.html?' + params; });
    const D = () => frame.contentDocument;
    const $ = id => D().getElementById(id);
    const q = sel => D().querySelector(sel);
    const click = el => { if (typeof el === 'string') el = $(el) || q(el); el.click(); };
    const key = k => D().dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
    const check = async (label, fn) => {
      try { const r = await fn(); row(r === true || r === undefined, label, r === true || r === undefined ? null : String(r)); }
      catch (e) { row(false, label, e && e.stack || String(e)); }
    };
    const seek = step => { const s = $('scrub'); s.value = step - 1; s.dispatchEvent(new Event('input', { bubbles: true })); };

    // keep the first-visit tour and picker out of the way, but start from a clean slate
    try { frame.contentWindow.localStorage.clear(); } catch (e) { /* not loaded yet */ }

    await load('level=2&theme=dark');
    // IntersectionObserver only reports on rendering frames, and headless Chrome in this test mode stops making
    // frames after a while, so these tasks are checked first, on the freshly loaded page.
    await check('Web lab: the IntersectionObserver tasks give the intended answer (measured on a fresh page)', async () => {
      const w = frame.contentWindow, L = w.WebLab, want = { 'api-io-first': '20', 'api-io-visible': '12' }, bad = [];
      for (const t of w.WEB_TASKS.filter(x => x.needsView)) {
        // headless Chrome sometimes renders no frame for a frame that has finished loading; reloading the task gives it another
        let got = null;
        for (let attempt = 0; attempt < 6 && got !== want[t.id]; attempt++) {
          L.close(); await sleep(50); L.open(t.id);
          for (let i = 0; i < 60 && L.expected() == null; i++) await sleep(100);
          got = L.expected();
        }
        if (got !== want[t.id]) bad.push(`${t.id}: got ${got}, intended ${want[t.id]}`);
      }
      L.close();
      return !bad.length || bad.join('; ');
    });
    await check('app starts and builds a trace',() => /^Step 1 \/ \d+/.test($('stepCount').textContent) || $('stepCount').textContent);
    await check('stepping forward moves to step 2', () => { click('btnNext'); return /^Step 2 \//.test($('stepCount').textContent) || $('stepCount').textContent; });
    await check('timeline click jumps to a later step', () => {
      const cv = $('timeline'), r = cv.getBoundingClientRect();
      cv.dispatchEvent(new MouseEvent('click', { clientX: r.left + r.width * 0.8, clientY: r.top + 5, bubbles: true }));
      const n = +/Step (\d+)/.exec($('stepCount').textContent)[1];
      return n > 10 || $('stepCount').textContent;
    });
    await check('View menu presets: Minimal hides the evaluation box', () => {
      click('btnView');
      if ($('viewMenu').classList.contains('hidden')) return 'menu did not open';
      click(q('[data-preset="minimal"]'));
      return $('viewName').textContent === 'Minimal' || $('viewName').textContent;
    });
    await check('View menu presets: Full detail', () => { click(q('[data-preset="full"]')); return $('viewName').textContent === 'Full detail' || $('viewName').textContent; });
    await check('keyboard shortcut X toggles expression evaluation (Custom view)', () => { click('btnView'); key('x'); return $('viewName').textContent === 'Custom' || $('viewName').textContent; });
    await check('shortcut list opens with ?', () => { key('?'); return !$('keysModal').classList.contains('hidden'); });
    key('Escape');

    await load('interview=bubblesort&theme=dark');
    await check('interview question loads', () => /Bubble sort/.test($('levelTitle').textContent) || $('levelTitle').textContent);
    await check('array view shows bars, pointers and a written cell', () => { seek(22); return (!!q('.arrview.bars .ac.wr') && !!q('.arrview .ap')) || 'no highlighted write / pointer'; });
    await check('evaluation tree is shown for the current line', () => {
      click('btnView'); click(q('[data-preset="beginner"]')); seek(22);
      return (!$('evalbox').classList.contains('hidden') && !!q('.et-tree li')) || 'evaluation box hidden';
    });
    await check('conditions show ✓ true / ✗ false inline', () => !!Array.from(D().querySelectorAll('.inl')).find(x => /^[✓✗]/.test(x.textContent)) || 'no condition badge');

    await load('interview=fibonacci&theme=dark');
    await check('call tree appears for recursion', () => { seek(60); return (!!q('.calltree svg') && !!q('.ct-n.cur')) || 'no call tree'; });

    await load('interview=interleave&theme=dark');
    await check('predict mode: a correct prediction is accepted', () => {
      click('btnLesson');
      $('ivGuess').value = '1\n3\n2\n4';
      click('ivCheck');
      return !!q('.iv-verdict.ok') || ($('ivResult').textContent || 'no verdict');
    });
    await check('predict mode: a wrong prediction shows a line-by-line diff', () => {
      $('ivGuess').value = '1\n2\n3\n4';
      click('ivCheck');
      return (!!q('.iv-verdict.bad') && D().querySelectorAll('.iv-diff tr.bad').length === 2) || 'diff not shown';
    });
    key('Escape');

    await load('interview=debounce&theme=dark');
    await check('write it yourself: starter has empty function bodies', async () => {
      click('btnLesson');
      click('ivWrite');
      await sleep(300);
      const code = frame.contentWindow.document.querySelector('.CodeMirror') ? frame.contentWindow.document.querySelector('.CodeMirror').CodeMirror.getValue() : $('editor').value;
      return (D().body.classList.contains('challenge-mode') && /your code here/.test(code)) || 'not in write-it mode';
    });
    await check('write it yourself: the empty starter fails with a mistake hint', () => {
      click('btnCheck');
      return (!!q('.tres.bad') && !!q('.tres.tips')) || 'no failure / tips';
    });
    await check('write it yourself: the reference solution passes', async () => {
      click('btnSolution');
      click('useSolution');
      await sleep(200);
      click('btnCheck');
      return !!q('.tres.win') || $('taskResults').textContent;
    });

    await load('level=2&theme=dark&interview=list');
    await check('interview menu: search filters the list', async () => {
      await sleep(400);
      const s = $('ivSearch');
      s.value = 'debounce';
      s.dispatchEvent(new Event('input', { bubbles: true }));
      const items = D().querySelectorAll('.iv-item');
      return (items.length >= 1 && items.length < 10) || `got ${items.length} items`;
    });
    await check('mock interview starts and ends with a scorecard', async () => {
      click('ivMock');
      await sleep(600);
      if ($('mockBar').classList.contains('hidden')) return 'mock bar not shown';
      key('Escape');
      click('mbEnd');
      return /Mock interview result/.test($('briefTitle').textContent) || $('briefTitle').textContent;
    });
    key('Escape');

    await load('level=2&theme=dark');
    await check('compare runs both versions', () => {
      click('btnCompare');
      $('cmpB').value = $('cmpA').value.replace('printSquare(4)', 'printSquare(5)');
      click('cmpRun');
      return (!!q('#cmpOut .cmp-table tr.diff')) || $('cmpOut').textContent;
    });
    key('Escape');
    await check('Big-O lab measures a preset (linear search → O(n))', () => {
      click('btnLab');
      click('labRun');
      return /O\(n\)/.test($('labTable').textContent) || $('labTable').textContent || $('labNote').textContent;
    });
    key('Escape');
    await check('export progress creates a download', () => {
      const w = frame.contentWindow;
      let made = false;
      const orig = w.URL.createObjectURL;
      w.URL.createObjectURL = () => { made = true; return 'blob:test'; };
      click('btnProgress');
      click('btnExport');
      w.URL.createObjectURL = orig;
      return made || 'no file was created';
    });
    key('Escape');

    await load('level=2&theme=dark');
    await check('practice: one header button, a list of every hands-on task (no theory), opening straight into the task', async () => {
      const w = frame.contentWindow, P = w.JSPractice;
      if (!$('btnPractice')) return 'no Practice button';
      const hiddenMenus = ['btnInterview', 'btnLevels', 'btnChallenges', 'btnProgress'].every(id => getComputedStyle($(id)).display === 'none');
      const list = P.list();
      const codeQs = w.JS_INTERVIEW.filter(x => x.kind !== 'theory').length;
      const all = list.length === codeQs + w.JS_CHALLENGES.length + (w.CSS_TASKS || []).length + (w.WEB_TASKS || []).length + (w.TS_TASKS || []).length + (w.TEST_TASKS || []).length + (w.PROJECTS || []).length && !list.some(t => w.JS_INTERVIEW.find(x => x.id === t.id && x.kind === 'theory'));
      click('btnPractice');
      await sleep(200);
      const items = D().querySelectorAll('#practiceList .pl-item').length;
      const k = list.findIndex(t => t.kind === 'predict');
      click(D().querySelectorAll('#practiceList .pl-item')[k]);
      await sleep(900);
      const predictBox = !!$('ivGuess') && !$('briefModal').classList.contains('hidden');
      const pillOk = !!$('practicePill') && new RegExp('Task ' + (k + 1) + ' /').test($('practicePill').textContent);
      key('Escape'); click(q('#briefModal [data-close]') || q('#briefModal .close'));
      return (hiddenMenus && all && items === list.length && predictBox && pillOk) || `menus hidden ${hiddenMenus}, all ${all} (${list.length}), items ${items}, predict box ${predictBox}, pill ${pillOk}`;
    });
    await check('practice: ▶ goes to the next task; a challenge opens in the editor; "need a hint?" opens the lesson', async () => {
      const w = frame.contentWindow, P = w.JSPractice, list = P.list();
      const c = list.findIndex(t => t.kind === 'build');
      P.open(c);
      await sleep(900);
      const inChallenge = D().body.classList.contains('challenge-mode') && w.JSLabAPI.currentKey() === list[c].key;
      click('ppNext');
      await sleep(900);
      const moved = w.JSLabAPI.currentKey() === list[c + 1].key;
      w.JSLabAPI.closeModals();
      const hint = $('ppHint');
      if (hint) click(hint);
      await sleep(200);
      const lessonOpen = !hint || !$('briefModal').classList.contains('hidden');
      key('Escape');
      return (inChallenge && moved && lessonOpen) || `challenge ${inChallenge}, next ${moved}, hint lesson ${lessonOpen}`;
    });

    await check('practice: an under-the-hood write-it task opens with empty bodies; a memory task switches the garbage view on', async () => {
      const w = frame.contentWindow, P = w.JSPractice, list = P.list();
      const ws = list.findIndex(t => t.id === 'w-marksweep');
      if (ws < 0 || list[ws].kind !== 'write') return 'w-marksweep is not a write task';
      P.open(ws);
      await sleep(900);
      const code = D().querySelector('.CodeMirror') ? D().querySelector('.CodeMirror').CodeMirror.getValue() : $('editor').value;
      const blank = /function markAndSweep\(heap, roots\) \{\s*\/\/[^\n]*\n\s*\}/.test(code) || !/marked\.add/.test(code);
      w.localStorage.setItem('jsl.gcView', 'false');
      const gc = list.findIndex(t => t.id === 'gc-reachable');
      P.open(gc);
      await sleep(900);
      const on = w.document.querySelector('#viewOpts [data-view="gcView"]');
      const gcOn = on ? on.checked : null;
      w.JSLabAPI.closeModals();
      return (blank && gcOn) || `starter blank ${blank}, garbage view on ${gcOn}`;
    });

    await check('CSS lab: every task\'s measured answer matches its explanation (real browser layout)', async () => {
      const w = frame.contentWindow, L = w.CSSLab;
      const want = {
        'css-specificity': 'rgb(255, 0, 0)', 'css-order': 'rgb(255, 255, 0)', 'css-important': 'rgb(0, 128, 0)', 'css-descendant': 'rgb(255, 165, 0)',
        'css-inherit': 0, 'css-em': 45, 'css-rem': 24, 'css-contentbox': 124, 'css-borderbox': 100, 'css-collapse': 30, 'css-percent-padding': 30,
        'css-inline-width': 'no, only as wide as its text', 'css-absolute': 30, 'css-zindex-static': 'B', 'css-stacking-context': 'the header',
        'css-flex-grow': 250, 'css-flex-shrink': 225, 'css-justify': 150, 'css-stretch': 100, 'css-grid-fr': 200, 'css-grid-span': 210, 'css-autofill': 3,
        'css-media': 'rgb(255, 0, 0)', 'css-vw': 200, 'html-tab': 3, 'html-label': 'the email input',
        'css-container': 'only the main-column card', 'css-has': 'rgb(255, 0, 0)', 'css-layer': 'rgb(255, 0, 0)', 'css-clamp': 20, 'css-transform': 0,
        'a11y-dialog': 'the Cancel button', 'a11y-aria-hidden': 'yes', 'a11y-inert': 'no',
        'css-logical': 'right',
      };
      const bad = [];
      for (const t of w.CSS_TASKS) {
        L.open(t.id);
        await sleep(400);
        const got = L.expected(), exp = want[t.id];
        const ok = typeof exp === 'number' ? Math.abs(got - exp) <= 1 : got === exp;
        if (!ok) bad.push(`${t.id}: browser ${got}, explanation ${exp}`);
      }
      // a check, the cascade table and the box model
      L.open('css-specificity'); await sleep(400);
      L.check('red'); await sleep(100);
      const right = !!q('#csResult .iv-verdict.ok') && D().querySelectorAll('#csWhy .cl-cascade tr').length === 4 && /#intro/.test(q('#csWhy .cl-cascade tr.win').textContent);
      L.open('css-contentbox'); await sleep(400);
      L.check('100'); await sleep(100);
      const wrong = !!q('#csResult .iv-verdict.bad') && !!q('#csWhy .bm-c');
      L.close();
      const inList = w.JSPractice.list().filter(x => x.kind === 'css').length === w.CSS_TASKS.length;
      return (!bad.length && right && wrong && inList) || `${bad.join('; ')} | right ${right}, wrong+box ${wrong}, in list ${inList}`;
    });

    await check('Web lab: every network / security / performance task gives the intended answer (XSS, CSP and layout shift really run)', async () => {
      const w = frame.contentWindow, L = w.WebLab;
      const want = {
        'net-cors-public': 'read', 'net-cors-missing': 'blocked', 'net-cors-json': 'preflight', 'net-cors-credentials': 'blocked', 'net-cors-port': 'blocked',
        'net-cache-fresh': 'cache', 'net-cache-nocache': '304', 'net-cache-stale': 'download', 'net-cache-hashed': 'cache',
        'sec-cookie-httponly': 'no', 'sec-csrf-lax': 'no', 'sec-lax-link': 'yes', 'sec-samesite-none': 'yes', 'sec-cookie-path': 'no',
        'sec-xss-img': 'runs', 'sec-xss-text': 'safe', 'sec-csp': 'safe',
        'perf-script-order': 'a.js, d.js, c.js, b.js', 'perf-css-blocks': 'yes', 'perf-cls': 'jumps', 'perf-cls-fixed': 'stays',
        'git-ff': 'C → B → A', 'git-merge': 'Merge feature → C → B → A', 'git-rebase': "B' → C → A", 'git-reset': 'B → A', 'git-revert': 'Revert C → C → B → A',
        'git-detached': 'no', 'git-cherry': "Fix' → C → A", 'npm-caret': 'yes', 'npm-major': 'no', 'npm-tilde': 'no', 'npm-zero': 'no',
        'render-csr-seo': 'no', 'render-ssr-seo': 'yes', 'render-csr-first': '770ms', 'render-ssr-click': 'no', 'render-ssg-price': 'old', 'render-isr-price': 'old', 'render-hydration': 'mismatch',
        'render-pick-docs': 'ssg', 'render-pick-dashboard': 'csr', 'render-pick-shop': 'isr', 'sw-cache-first': 'v1', 'sw-network-first': 'v2', 'sw-swr': 'v2', 'sw-offline-nocache': 'error',
        'api-io-first': '20', 'api-io-visible': '12', 'api-storage-string': 'object', 'api-storage-event': 'no', 'api-history': 'no',
        'auth-jwt-read': 'yes', 'auth-token-xss': 'yes', 'auth-refresh': '3', 'auth-refresh-race': '6', 'auth-oauth': 'a', 'intl-price': 'de', 'intl-date': '04/03/2026', 'intl-timezone': 'Jan 4',
        'live-poll': '15.1s', 'live-ws': '12.1s', 'live-reconnect': 'lost', 'live-pick': 'sse',
        'ex-mul': '7', 'ex-pow': '512', 'ex-minus-str': '"31"', 'ex-compare-chain': 'false', 'ex-or-chain': 'null', 'ex-nullish': '0', 'ex-and-or': '"big"', 'ex-optional': 'undefined', 'ex-plus-obj': '"[object Object]"', 'ex-typeof': '"string"', 'ex-mix-error': 'SyntaxError', 'ex-neg-pow': 'SyntaxError',
        'tp-add-month': '2026-02-28', 'tp-immutable': '2026-05-10', 'tp-month': '3', 'tp-until': 'P59D', 'tp-dst': '2026-03-08T03:30:00-04:00[America/New_York]', 'tp-invalid': 'RangeError', 'tp-equals': 'false, true', 'tp-sort': '2026-02-15, 2026-09-30, 2026-12-01',
        'ns-pull': '3', 'ns-transform': '2 chunks: HELLO STREAM', 'ns-uuid': '36 chars, version 4', 'ns-sha': '64 hex chars, starts ba7816bf',
      };
      const bad = [];
      for (const t of w.WEB_TASKS) {
        if (t.needsView) continue; // observer tasks: checked on a fresh page in the next test
        L.open(t.id);
        await sleep(t.kind === 'measure' ? 900 : 50);
        const got = L.expected();
        const exp = ['db', 'deploy', 'team', 'corp', 'term', 'ivs', 'roles', 'aiwork', 'tax', 'oss', 'nodex', 'earn', 'freelance', 'design', 'current', 'health', 'business'].includes(t.solver) ? t.scenario.a : want[t.id];
        if (got !== exp) bad.push(`${t.id}: got ${got}, intended ${exp}`);
        if (!t.choices.includes(got)) bad.push(`${t.id}: answer ${got} is not one of the choices`);
      }
      L.open('net-cors-json'); await sleep(50);
      click(q('#webLab [data-wbchoice="read"]')); await sleep(50);
      const steps = D().querySelectorAll('#wbWhy .wl-steps li').length >= 4 && !!q('#wbResult .iv-verdict.bad');
      L.open('perf-script-order'); await sleep(50);
      L.check('a.js, d.js, c.js, b.js'); await sleep(50);
      const fall = D().querySelectorAll('#wbWhy .wl-row').length >= 5 && !!q('#wbResult .iv-verdict.ok');
      L.close();
      const inList = w.JSPractice.list().filter(x => x.kind === 'web').length === w.WEB_TASKS.length;
      return (!bad.length && steps && fall && inList) || `${bad.join('; ')} | steps ${steps}, waterfall ${fall}, in list ${inList}`;
    });

    await check('Test lab: every model answer passes on the correct code and catches every bug; every starter misses at least one', async () => {
      const w = frame.contentWindow, L = w.TestLab, bad = [];
      for (const t of w.TEST_TASKS) {
        const good = await L.runAll(t, t.solution);
        if (good.correct.error || !good.correct.results.length || good.correct.results.some(x => !x.pass)) bad.push(`${t.id}: model answer fails on the correct code (${good.correct.error || (good.correct.results.find(x => !x.pass) || {}).msg})`);
        good.bugs.forEach((b, i) => { if (b.error) bad.push(`${t.id} bug ${i + 1}: ${b.error}`); else if (!b.caught) bad.push(`${t.id}: model answer misses bug ${i + 1}`); });
        const start = await L.runAll(t, t.starter);
        if (start.correct.results.some(x => !x.pass)) bad.push(`${t.id}: starter fails on the correct code`);
        if (start.bugs.every(b => b.caught)) bad.push(`${t.id}: starter already catches every bug`);
      }
      L.open('t-sumeven'); await sleep(100);
      L.setTests(w.TEST_TASKS[0].solution); click('tlRun'); await sleep(1500);
      const shown = !!q('#tlResult .iv-verdict.ok') && !!q('#tlResult .tl-matrix');
      L.close();
      const inList = w.JSPractice.list().filter(x => x.kind === 'test').length === w.TEST_TASKS.length;
      return (!bad.length && shown && inList) || `${bad.join('; ')} | result shown ${shown}, in list ${inList}`;
    });

    await check('🖥️ Code → Pixels: every stage draws; DOM, render tree, layout and layers are right; a JS change re-runs the right stages', async () => {
      const w = frame.contentWindow, X = w.PixelsLab, bad = [];
      click('btnPixels'); await sleep(900);
      if ($('pixelsLab').classList.contains('hidden')) return 'the tab did not open';
      const M = X.model(), L = X.live();
      if (!L) return 'the page was not measured';
      if (M.tokens.length < 20 || M.reveal[M.reveal.length - 1] !== M.nodes.length) bad.push(`tokens ${M.tokens.length}, revealed ${M.reveal[M.reveal.length - 1]} of ${M.nodes.length} DOM nodes`);
      if (X.stages().length !== 9 || X.stages().some(s => s.key === 'react')) bad.push('a plain page should have 9 steps without React');
      for (let i = 0; i < X.stages().length; i++) { X.go(i); await sleep(60); if (!q('#pxBody').innerHTML.trim()) bad.push('stage ' + (i + 1) + ' is empty'); }
      X.go(3); await sleep(60);
      const render = q('#pxBody').textContent;
      if (!/p\.hidden.*display: none/.test(render) || !/::before "\$"/.test(render)) bad.push('render tree misses display:none or ::before');
      X.go(4); await sleep(60);
      if (D().querySelectorAll('#pxOverlay .px-b').length < 6) bad.push('layout draws ' + D().querySelectorAll('#pxOverlay .px-b').length + ' boxes');
      X.go(5); await sleep(60);
      if (D().querySelectorAll('#pxOverlay .px-p').length < 5) bad.push('paint draws too little');
      // a click in the page: width change → layout
      X.go(8); await sleep(60);
      X.frame().contentDocument.getElementById('buy').click(); await sleep(400);
      if (!X.log()[0] || X.log()[0].kind !== 'layout' || !/width/.test(q('#pxBody').textContent)) bad.push('card click: ' + (X.log()[0] && X.log()[0].kind));
      // the three kinds of change
      X.open('changes'); await sleep(900); X.go(8); await sleep(60);
      const kinds = {};

        'ts-literal': '"hi"', 'ts-union': 'error', 'ts-narrow': 'string', 'ts-unknown': 'line 4', 'ts-optional': 'error', 'ts-nullish': 'number',
        'ts-excess': 'line 3', 'ts-readonly': 'error', 'ts-literal-union': 'error', 'ts-discriminated': 'line 7',
        'ts-generic': 'number | undefined', 'ts-constraint': 'line 6', 'ts-keyof': 'number', 'ts-partial': 'compiles', 'ts-omit': 'error',
        'ts-returntype': '{ id: number; name: string; }', 'ts-record': 'error', 'ts-async': 'Promise<number>', 'ts-guard': 'Fish[]',
        'ts-react-props': 'line 6', 'ts-react-never': 'never[]', 'ts-react-event': 'compiles',
      };
      await L.load();
      const bad = [];
      for (const t of w.TS_TASKS) {
        let r;
        try { r = L.analyse(t.code, t.tsx); } catch (e) { bad.push(`${t.id}: compiler crashed (${e.message})`); continue; }
        const got = L.answerOf(t, r);
        if (got !== want[t.id]) bad.push(`${t.id}: compiler says ${got}, intended ${want[t.id]}`);
        if (!t.choices.includes(got)) bad.push(`${t.id}: ${got} is not one of the choices`);
        // only the one error the task is about, never a gap in the small standard library
        if (r.errors.length > 1 || r.errors.some(e => /Cannot find (name|global)|not a valid async/.test(e.text))) bad.push(`${t.id}: extra errors ${r.errors.map(e => e.text).join(' | ')}`);
      }
      const libOk = !L.analyse('const k = Object.keys({ a: 1 });\nconst all = Promise.all([fetch("/a").then(r => r.json())]);\nconst ok = Array.isArray(k) && Number.isNaN(1);').errors.length;
      L.open('ts-union'); await sleep(300);
      L.check('compiles'); await sleep(100);
      const shown = !!q('#tsResult .iv-verdict.bad') && D().querySelectorAll('#tsWhy .wl-steps li.no').length === 1 && /function shout/.test(q('#tsWhy .ts-js').textContent);
      L.close();
      return (!bad.length && libOk && shown) || `${bad.join('; ')} | small lib ok ${libOk}, under the hood ${shown}`;
    });

    await load('level=2&tour&theme=dark');
    await check('guided tour opens, advances and closes', async () => {
      await sleep(600);
      if ($('tour').classList.contains('hidden')) return 'tour not shown';
      click('tourNext');
      if (!/2 \/ /.test(q('.tour-count').textContent)) return 'did not advance';
      key('Escape');
      return $('tour').classList.contains('hidden') || 'did not close';
    });

    await load('level=2&theme=light');
    await check('light theme applies', () => D().documentElement.dataset.theme === 'light' || D().documentElement.dataset.theme);

    document.getElementById('sum').innerHTML = `<span class="${fail ? 'bad' : 'ok'}">${fail ? '✘' : '✔'} ${pass} passed, ${fail} failed</span>`;
    document.title = (fail ? 'FAIL ' : 'PASS ') + document.title;
  })();
  </script>
</body>
</html>
